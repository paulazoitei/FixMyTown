<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reset Password - FixMyTown</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #333;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 80px;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }

        h2 {
            color: #00695C;
            margin-bottom: 25px;
            font-size: 24px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #00695C;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        button:hover:enabled {
            background-color: #004D40;
        }

        .message {
            margin-top: 18px;
            font-size: 15px;
        }

        .error {
            color: #d32f2f;
        }

        .success {
            color: #388e3c;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Reset Your Password</h2>
    <input type="password" id="newPassword" placeholder="New password" />
    <input type="password" id="confirmPassword" placeholder="Confirm password" />
    <button id="resetBtn" onclick="submitPassword()">Reset Password</button>
    <div class="message" id="messageBox"></div>
</div>

<script>
    async function submitPassword() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const messageBox = document.getElementById('messageBox');
        const button = document.getElementById('resetBtn');

        // 🔒 Reguli de complexitate
        const isComplex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/.test(newPassword);

        if (!token || !newPassword || !confirmPassword) {
            messageBox.innerText = "All fields are required.";
            messageBox.className = "message error";
            return;
        }

        if (!isComplex) {
            messageBox.innerText = "Password must be at least 8 characters and include a capital letter, a number, and a special character.";
            messageBox.className = "message error";
            return;
        }

        if (newPassword !== confirmPassword) {
            messageBox.innerText = "Passwords do not match.";
            messageBox.className = "message error";
            return;
        }

        try {
            const response = await fetch('/api/v1/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });

            const text = await response.text();
            messageBox.innerText = text;
            messageBox.className = response.ok ? "message success" : "message error";

            if (response.ok) {
                button.disabled = true;
            }
        } catch (err) {
            messageBox.innerText = "Something went wrong. Please try again.";
            messageBox.className = "message error";
        }
    }
</script>
</body>
</html>
